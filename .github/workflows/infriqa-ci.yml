name: CI Pipeline
'on':
  push:
    branches: &id001
    - InfrIQa
    - InfrIQa-dev
    - dev
    - development
  pull_request:
    branches: *id001
env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/webapp
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Install dependencies
      run: npm install
    - name: Run linting
      run: npm run lint || echo 'No lint script found'
    - name: Run tests
      run: npm test || echo 'No test script found'
    - name: Build application
      run: npm run build
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: packages/webapp/./dist
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/webapp
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Install dependencies
      run: npm install
    - name: Run linting
      run: npm run lint || echo 'No lint script found'
    - name: Run tests
      run: npm test || echo 'No test script found'
  integration-ci:
    runs-on: ubuntu-latest
    needs:
    - frontend-ci
    - backend-ci
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
    - name: Run integration tests
      run: "echo '\u26A0\uFE0F No integration test runner detected \u2014 skipping'\
        \ && exit 0"
