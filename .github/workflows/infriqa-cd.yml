name: CD Pipeline
'on':
  push:
    branches:
    - InfrIQa
    - InfrIQa-dev
    - dev
    - development
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false
env:
  AZURE_SUBSCRIPTION_ID: d6c69b8a-1b49-482e-80c0-95ccb98fd3c6
  AZURE_RESOURCE_GROUP: test04-dev-rg
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
jobs:
  deploy-database-test04-dev-cosmos:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Verify Azure CLI
      run: az --version
    - name: Verify Cosmos DB Connection
      run: az cosmosdb show --name test04-dev-cosmos --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query 'documentEndpoint' -o tsv
  deploy-database-test04-dev-cosmos-sql-db:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Verify Azure CLI
      run: az --version
    - name: Verify Cosmos DB Connection
      run: az cosmosdb show --name test04-dev-cosmos-sql-db --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query 'documentEndpoint' -o tsv
  deploy-database-test04-dev-cosmos-sql-container:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Verify Azure CLI
      run: az --version
    - name: Verify Cosmos DB Connection
      run: az cosmosdb show --name test04-dev-cosmos-sql-container --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query 'documentEndpoint' -o tsv
  deploy-frontend-test04-dev-frontend-web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/webapp
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Set Active Azure Subscription
      run: az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Install dependencies
      run: npm install
    - name: Set Frontend Environment Variables
      run: echo "API_URL=https://test04-dev-backend-3b6095.azurewebsites.net" >> .env && echo "API_URL=https://test04-dev-backend-3b6095.azurewebsites.net" >> .env.production
    - name: Build frontend
      run: npm run build
    - name: Deploy to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APP }}
        repo_token: ${{ github.token }}
        action: upload
        app_location: packages/webapp/./dist
        output_location: ''
        skip_app_build: true
    - name: Verify Frontend Deployment
      run: "echo 'Verifying frontend deployment health at https://green-ground-03eeec310.7.azurestaticapps.net...'\nsuccess=false\nwait_sec=5\nfor i in {1..10}; do\n  if curl -s -f \"https://green-ground-03eeec310.7.azurestaticapps.net\" > /dev/null; then\n    echo '\u2705 Frontend health check passed!'\n    success=true\n    break\n  fi\n  echo \"Attempt $i failed. Retrying in ${wait_sec}s...\"\n  sleep $wait_sec\n  wait_sec=$((wait_sec * 2 > 120 ? 120 : wait_sec * 2))\ndone\nif [ \"$success\" = false ]; then\n  echo '\u274C Frontend health check failed after all attempts.'\n  exit 1\nfi"
  deploy-backend-test04-dev-backend-3b6095:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/api
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Set Active Azure Subscription
      run: az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}
    - name: Configure Backend Database App Settings
      run: |-
        CONNECTION_STRING=$(az cosmosdb keys list --name test04-dev-cosmos --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --type connection-strings --query 'connectionStrings[0].connectionString' -o tsv)
        az webapp config appsettings set --name test04-dev-backend-3b6095 --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --settings DATABASE_URL="$CONNECTION_STRING"
    - name: Configure App Service CORS, App Settings and Startup Command
      run: |-
        az webapp config appsettings set --name test04-dev-backend-3b6095 --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --settings NODE_ENV="production" SCM_DO_BUILD_DURING_DEPLOYMENT="true" ENABLE_ORYX_BUILD="true"
        az webapp config set --name test04-dev-backend-3b6095 --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --startup-file "npm start"
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Install dependencies
      run: npm install
    - name: Configure App Service Port Settings
      uses: azure/CLI@v2
      with:
        inlineScript: az webapp config appsettings set --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name test04-dev-backend-3b6095 --settings WEBSITES_PORT=8080 PORT=8080
    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: test04-dev-backend-3b6095
        slot-name: production
        package: ${{ github.workspace }}/packages/api
        publish-profile: ${{ secrets.APP_SERVICE }}
    - name: Verify Backend Deployment
      run: "echo 'Verifying backend deployment health at https://test04-dev-backend-3b6095.azurewebsites.net...'\nsuccess=false\nwait_sec=5\nfor i in {1..10}; do\n  if curl -s -f --connect-timeout 5 --max-time 10 \"https://test04-dev-backend-3b6095.azurewebsites.net/health\" > /dev/null || curl -s -f --connect-timeout 5 --max-time 10 \"https://test04-dev-backend-3b6095.azurewebsites.net/api/health\" > /dev/null || curl -s -f --connect-timeout 5 --max-time 10 \"https://test04-dev-backend-3b6095.azurewebsites.net\" > /dev/null; then\n    echo '\u2705 Backend health check passed!'\n    success=true\n    break\n  fi\n  echo \"Attempt $i failed. Retrying in ${wait_sec}s...\"\n  sleep $wait_sec\n  wait_sec=$((wait_sec * 2 > 120 ? 120 : wait_sec * 2))\ndone\nif [ \"$success\" = false ]; then\n  echo '\u274C Backend health check failed after all attempts.'\n  exit 1\nfi"
  configure-cors:
    runs-on: ubuntu-latest
    needs:
    - deploy-frontend-test04-dev-frontend-web-app
    - deploy-backend-test04-dev-backend-3b6095
    steps:
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Set Active Azure Subscription
      run: az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}
    - name: Configure CORS and Frontend URL on Backend
      run: |-
        echo "Fetching Static Web App actual live hostname..."
        FRONTEND_HOST=$(az staticwebapp environment list --name test04-dev-frontend-web-app \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query "[0].hostname" -o tsv)
        if [ -z "$FRONTEND_HOST" ]; then
          echo "Could not fetch SWA hostname via environment list, trying fallback..."
          FRONTEND_HOST=$(az staticwebapp show --name test04-dev-frontend-web-app \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "defaultHostname" -o tsv)
        fi
        if [ -z "$FRONTEND_HOST" ]; then
          echo "Could not fetch SWA hostname. Skipping CORS configuration."
          exit 0
        fi
        echo "Frontend hostname: $FRONTEND_HOST"
        echo "Setting CORS on app service: test04-dev-backend-3b6095..."
        az webapp config appsettings set --name test04-dev-backend-3b6095 --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --settings CORS_ORIGIN="https://$FRONTEND_HOST" FRONTEND_URL="https://$FRONTEND_HOST"
